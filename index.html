<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Manifest -->
    <link rel="manifest" href="manifest.webmanifest">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- PWA-теги для iOS (Safari не читает manifest полностью) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rube Runner">

    <!-- Общие мобильные теги -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#16161a">
    <meta name="color-scheme" content="dark">

    <title>Rube Goldberg Runner — Turbines & Particles</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        canvas {
            background: #16161a;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
            display: block;
            touch-action: none;
        }
    </style>
    <script src="vendor/matter.min.js"></script>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const { Engine, World, Bodies, Body, Events } = Matter;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// =========================================================
//                     КОНФИГУРАЦИЯ
// =========================================================
// Все игровые параметры собраны в одном месте.
// Меняйте здесь — изменения подхватятся автоматически.
const CONFIG = {
    // ---- Физика ----
    physics: {
        gravity: 0.6,            // Гравитация по вертикали
        step: 1000 / 60,         // Фиксированный шаг физики (60 Гц)
        maxVelocity: 12          // Ограничение горизонтальной скорости шарика
    },

    // ---- Шарик ----
    ball: {
        radiusRatio: 0.03,       // Радиус как доля от ширины экрана
        radiusMin: 10,           // Минимальный радиус в px
        bounce: 0.85,            // Упругость (0..1)
        friction: 0.005,         // Трение
        frictionAir: 0.002       // Сопротивление воздуха
    },

    // ---- Платформы ----
    platforms: {
        widthRatio: 0.18,        // Ширина как доля от ширины экрана
        heightRatio: 0.02,       // Высота как доля от высоты экрана
        heightMin: 12,           // Минимальная высота в px
        maxHits: 3,              // Прочность (число отскоков до разрушения)
        maxCount: 4              // Максимум одновременно активных платформ
    },

    // ---- Скролл мира ----
    scroll: {
        speed: 0.8               // Пикселей за один физический шаг
    },

    // ---- Комбо ----
    combo: {
        timeout: 1500            // мс, через сколько гаснет комбо
    },

    // ---- Турбины (пушки с ветром) ----
    turbine: {
        widthRatio: 0.12,        // Длина сопла как доля от ширины экрана
        heightRatio: 0.05,       // Толщина сопла как доля от ширины экрана
        count: 4,                // Сколько турбин держать в мире одновременно
        spawnGapMin: 200,        // Мин. расстояние между турбинами по Y
        spawnGapMax: 150,        // Макс. случайная добавка к расстоянию
        angleJitter: 0.7,        // Разброс угла наклона (±половина)
        firstSpawnOffset: 50,    // Отступ первой турбины за нижней границей

        // ---- Ветер ----
        windPower: 0.0011,       // Базовая сила ветра (было 0.0022 — уменьшено в 2 раза)
        windRangeRatio: 0.75,    // Длина конуса как доля от ширины экрана
        windSpread: 0.22,        // Половина угла раскрытия конуса (в радианах)
        particleMultiplier: 220  // Во сколько раз сильнее ветер действует на частицы
    },

    // ---- Частицы (светлячки) ----
    particles: {
        count: 80,               // Сколько частиц держать в мире
        fallSpeedMin: 0.5,
        fallSpeedMax: 1.0,
        driftX: 0.3,             // Горизонтальный дрейф
        radiusMin: 1.5,
        radiusMax: 3.5,
        alphaMin: 0.3,
        alphaMax: 0.9,
        maxSpeed: 5,             // Ограничение скорости частицы
        despawnMargin: -50       // На сколько выше верхней границы удалять
    },

    // ---- Прочее ----
    misc: {
        gameLoopMaxDelta: 250,   // Защита от "спирали смерти" (мс)
        targetRatio: 9 / 16      // Соотношение сторон игрового поля
    }
};

// ---- Производные константы (для удобства чтения кода) ----
const STEP = CONFIG.physics.step;
const MAX_HITS = CONFIG.platforms.maxHits;
const MAX_PLATFORMS = CONFIG.platforms.maxCount;
const MAX_VELOCITY = CONFIG.physics.maxVelocity;
const COMBO_TIMEOUT = CONFIG.combo.timeout;

// ---- Физический движок ----
const engine = Engine.create({ gravity: { x: 0, y: CONFIG.physics.gravity } });
const world = engine.world;

// ---- Адаптивные размеры ----
let PLATFORM_WIDTH, PLATFORM_HEIGHT, BALL_RADIUS;
let TURBINE_W, TURBINE_H;

// ---- Состояние ----
let score = 0;
let combo = 0;
let comboTimer = 0;
let gameOver = false;
let cameraY = 0;

let ball, leftWall, rightWall;
let platforms = [];
let windZones = [];
let particles = [];

// ---- HUD: состояние анимаций ----
let hudComboScale = 1;
let hudComboAlpha = 0;
let lastShownCombo = 0;

// =========================================================
//                   АДАПТАЦИЯ ЭКРАНА
// =========================================================
function resizeGame() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const targetRatio = CONFIG.misc.targetRatio;

    let cw = w, ch = h;
    if (w / h > targetRatio) {
        cw = h * targetRatio;
    } else {
        ch = w / targetRatio;
    }

    canvas.width = cw;
    canvas.height = ch;

    PLATFORM_WIDTH = canvas.width * CONFIG.platforms.widthRatio;
    PLATFORM_HEIGHT = Math.max(CONFIG.platforms.heightMin, canvas.height * CONFIG.platforms.heightRatio);
    BALL_RADIUS = Math.max(CONFIG.ball.radiusMin, canvas.width * CONFIG.ball.radiusRatio);
    TURBINE_W = canvas.width * CONFIG.turbine.widthRatio;
    TURBINE_H = canvas.width * CONFIG.turbine.heightRatio;

    // Пересоздаём боковые стены под новый размер
    if (leftWall) World.remove(world, leftWall);
    if (rightWall) World.remove(world, rightWall);

    leftWall = Bodies.rectangle(-10, canvas.height / 2, 20, canvas.height * 3,
        { isStatic: true, restitution: 0.9, friction: 0 });
    rightWall = Bodies.rectangle(canvas.width + 10, canvas.height / 2, 20, canvas.height * 3,
        { isStatic: true, restitution: 0.9, friction: 0 });
    World.add(world, [leftWall, rightWall]);

    // Шарик создаём только один раз, дальше не трогаем его физический радиус
    if (!ball) {
        ball = Bodies.circle(canvas.width / 2, 100, BALL_RADIUS, {
            restitution: CONFIG.ball.bounce,
            friction: CONFIG.ball.friction,
            frictionAir: CONFIG.ball.frictionAir,
            label: 'ball'
        });
        World.add(world, ball);
    }

    // Стартовые частицы
    if (particles.length === 0) {
        for (let i = 0; i < CONFIG.particles.count; i++) {
            particles.push(createParticle(
                Math.random() * canvas.width,
                cameraY + Math.random() * canvas.height
            ));
        }
    }
}

window.addEventListener('resize', resizeGame);
resizeGame();

// =========================================================
//                     ЧАСТИЦЫ (СВЕТЛЯЧКИ)
// =========================================================
function createParticle(x, y) {
    const P = CONFIG.particles;
    return {
        x, y,
        vx: (Math.random() - 0.5) * P.driftX,
        vy: P.fallSpeedMin + Math.random() * (P.fallSpeedMax - P.fallSpeedMin),
        radius: P.radiusMin + Math.random() * (P.radiusMax - P.radiusMin),
        alpha: P.alphaMin + Math.random() * (P.alphaMax - P.alphaMin)
    };
}

// =========================================================
//                       ТУРБИНЫ
// =========================================================
// Создаём пушку на стене: position у края экрана, угол направлен внутрь
function spawnTurbine(atWorldY) {
    const T = CONFIG.turbine;
    const isLeft = Math.random() > 0.5;
    const spawnX = isLeft ? 0 : canvas.width;

    // Базовое направление внутрь экрана + разброс
    const baseAngle = isLeft ? 0 : Math.PI;
    const angle = baseAngle + (Math.random() - 0.5) * T.angleJitter;

    return {
        x: spawnX,
        y: atWorldY,
        isLeft,
        angle,
        range: canvas.width * T.windRangeRatio,
        spread: T.windSpread,
        forceX: Math.cos(angle) * T.windPower,
        forceY: Math.sin(angle) * T.windPower
    };
}

function manageWindZones() {
    const T = CONFIG.turbine;

    // Убираем те, что ушли вверх
    windZones = windZones.filter(z => z.y - cameraY > -200);

    // Доспавниваем снизу
    while (windZones.length < T.count) {
        const lastY = windZones.length > 0
            ? windZones[windZones.length - 1].y
            : cameraY + canvas.height + T.firstSpawnOffset;

        windZones.push(spawnTurbine(lastY + T.spawnGapMin + Math.random() * T.spawnGapMax));
    }
}

// Проверка: попадает ли точка в конус ветра
function pointInWind(px, py, zone) {
    const dx = px - zone.x;
    const dy = py - zone.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > zone.range) return false;
    if (dist < 1) return true;

    const a = Math.atan2(dy, dx);
    let diff = a - zone.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;

    return Math.abs(diff) < zone.spread;
}

// =========================================================
//                   ОКРУЖЕНИЕ: ЧАСТИЦЫ
// =========================================================
function manageParticles() {
    const P = CONFIG.particles;
    const T = CONFIG.turbine;

    particles = particles.filter(p => p.y - cameraY > P.despawnMargin);

    while (particles.length < P.count) {
        particles.push(createParticle(
            Math.random() * canvas.width,
            cameraY + canvas.height + Math.random() * 50
        ));
    }

    for (const p of particles) {
        let inWind = false;

        for (const zone of windZones) {
            if (pointInWind(p.x, p.y, zone)) {
                p.vx += zone.forceX * T.particleMultiplier;
                p.vy += zone.forceY * T.particleMultiplier;
                inWind = true;
            }
        }

        if (!inWind) {
            p.vx *= 0.94;
            if (p.vy > 1.2) p.vy *= 0.95;
            if (p.vy < 0.5) p.vy += 0.05;
        }

        // Ограничение скорости частицы
        const sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (sp > P.maxSpeed) {
            p.vx = (p.vx / sp) * P.maxSpeed;
            p.vy = (p.vy / sp) * P.maxSpeed;
        }

        p.x += p.vx;
        p.y += p.vy;
    }
}

// =========================================================
//                     СТОЛКНОВЕНИЯ
// =========================================================
Events.on(engine, 'collisionStart', event => {
    for (const pair of event.pairs) {
        const { bodyA, bodyB } = pair;

        const pBody = bodyA.label === 'platform'
            ? bodyA
            : (bodyB.label === 'platform' ? bodyB : null);

        const isBall = bodyA.label === 'ball' || bodyB.label === 'ball';

        if (pBody && pBody.gameObject && isBall) {
            const p = pBody.gameObject;
            p.hitsLeft--;

            combo++;
            comboTimer = COMBO_TIMEOUT;

            score += 10 * Math.max(1, combo);

            if (p.hitsLeft <= 0) p.toDelete = true;
        }
    }
});

// =========================================================
//                   СПАВН ПЛАТФОРМ
// =========================================================
function handleSpawn(clientX, clientY) {
    if (gameOver) {
        resetGame();
        return;
    }

    // Лимит одновременных платформ
    if (platforms.length >= MAX_PLATFORMS) return;

    const rect = canvas.getBoundingClientRect();
    const clickX = (clientX - rect.left) * (canvas.width / rect.width);
    const clickY = (clientY - rect.top) * (canvas.height / rect.height);

    if (clickX < 0 || clickX > canvas.width || clickY < 0 || clickY > canvas.height) return;

    const worldY = clickY + cameraY;

    const pBody = Bodies.rectangle(clickX, worldY, PLATFORM_WIDTH, PLATFORM_HEIGHT, {
        isStatic: true,
        label: 'platform',
        friction: 0.05
    });

    const newPlatform = { body: pBody, hitsLeft: MAX_HITS, toDelete: false };
    pBody.gameObject = newPlatform;

    platforms.push(newPlatform);
    World.add(world, pBody);
}

// Pointer Events работают и на ПК, и на мобильных, без двойных срабатываний
canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    handleSpawn(e.clientX, e.clientY);
}, { passive: false });

// =========================================================
//                       СБРОС
// =========================================================
function resetGame() {
    score = 0;
    combo = 0;
    comboTimer = 0;
    cameraY = 0;
    gameOver = false;

    hudComboScale = 1;
    hudComboAlpha = 0;
    lastShownCombo = 0;

    platforms.forEach(p => World.remove(world, p.body));
    platforms = [];
    windZones = [];
    particles = [];

    Body.setPosition(ball, { x: canvas.width / 2, y: 100 });
    Body.setVelocity(ball, { x: 0, y: 0 });
    Body.setAngularVelocity(ball, 0);

    // Заново создаём частицы
    for (let i = 0; i < CONFIG.particles.count; i++) {
        particles.push(createParticle(
            Math.random() * canvas.width,
            Math.random() * canvas.height
        ));
    }
}

// =========================================================
//                     ЛОГИКА
// =========================================================
function update() {
    if (gameOver) return;

    Engine.update(engine, STEP);
    cameraY += CONFIG.scroll.speed;

    // Стены двигаются вместе с камерой
    Body.setPosition(leftWall, { x: -10, y: cameraY + canvas.height / 2 });
    Body.setPosition(rightWall, { x: canvas.width + 10, y: cameraY + canvas.height / 2 });

    manageWindZones();
    manageParticles();

    // Ветер на шар
    for (const zone of windZones) {
        if (pointInWind(ball.position.x, ball.position.y, zone)) {
            Body.applyForce(ball, ball.position, { x: zone.forceX, y: zone.forceY });
        }
    }

    // Ограничение горизонтальной скорости
    if (Math.abs(ball.velocity.x) > MAX_VELOCITY) {
        Body.setVelocity(ball, {
            x: Math.sign(ball.velocity.x) * MAX_VELOCITY,
            y: ball.velocity.y
        });
    }

    // Удаление отработавших платформ
    for (let i = platforms.length - 1; i >= 0; i--) {
        const p = platforms[i];
        if (p.toDelete || (p.body.position.y - cameraY < -50)) {
            World.remove(world, p.body);
            platforms.splice(i, 1);
        }
    }

    // Комбо-таймер
    if (comboTimer > 0) {
        comboTimer -= STEP;
        if (comboTimer <= 0) {
            combo = 0;
            comboTimer = 0;
        }
    }

    // Проигрыш
    if (ball.position.y - cameraY > canvas.height + 20) gameOver = true;
    if (ball.position.y - cameraY < -40) gameOver = true;
}

// =========================================================
//               ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ РИСОВАНИЯ
// =========================================================
function roundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

// =========================================================
//                    HUD: ОТРИСОВКА
// =========================================================
function drawHUD() {
    const W = canvas.width;
    const H = canvas.height;
    const pad = Math.max(10, W * 0.025);
    const barH = Math.max(48, H * 0.075);
    const radius = barH * 0.35;

    // ---------- Верхняя панель ----------
    ctx.save();

    const grad = ctx.createLinearGradient(0, 0, 0, barH);
    grad.addColorStop(0, 'rgba(22, 22, 26, 0.95)');
    grad.addColorStop(1, 'rgba(22, 22, 26, 0.75)');

    ctx.fillStyle = grad;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.lineWidth = 1;

    roundRect(ctx, pad, pad, W - pad * 2, barH, radius);
    ctx.fill();
    ctx.stroke();

    // ---------- Очки (слева) ----------
    const fontSize = Math.max(18, W * 0.055);
    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    const cy = pad + barH / 2;
    const iconR = fontSize * 0.38;
    const iconX = pad + pad + iconR;

    ctx.shadowBlur = 8;
    ctx.shadowColor = '#ff4757';
    ctx.beginPath();
    ctx.arc(iconX, cy, iconR, 0, Math.PI * 2);
    ctx.fillStyle = '#ff4757';
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(iconX - iconR * 0.3, cy - iconR * 0.3, iconR * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.fillText(`${score}`, iconX + iconR + fontSize * 0.4, cy + 1);

    // ---------- Слоты платформ (справа) ----------
    const slotSize = Math.max(12, W * 0.032);
    const slotGap = slotSize * 0.35;
    const totalSlotsW = MAX_PLATFORMS * slotSize + (MAX_PLATFORMS - 1) * slotGap;
    const slotsStartX = W - pad - pad - totalSlotsW;
    const slotsY = cy - slotSize / 2;

    for (let i = 0; i < MAX_PLATFORMS; i++) {
        const sx = slotsStartX + i * (slotSize + slotGap);
        const filled = i < platforms.length;

        ctx.fillStyle = filled ? 'rgba(46, 213, 115, 0.15)' : 'rgba(255, 255, 255, 0.05)';
        roundRect(ctx, sx, slotsY, slotSize, slotSize, slotSize * 0.3);
        ctx.fill();

        if (filled) {
            ctx.fillStyle = '#2ed573';
            roundRect(ctx, sx + 2, slotsY + 2, slotSize - 4, slotSize - 4, slotSize * 0.25);
            ctx.fill();
        } else {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            roundRect(ctx, sx + 0.5, slotsY + 0.5, slotSize - 1, slotSize - 1, slotSize * 0.3);
            ctx.stroke();
        }
    }

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = `600 ${Math.max(9, W * 0.022)}px sans-serif`;
    ctx.textAlign = 'right';
    ctx.fillText('ПЛАТФОРМЫ', W - pad - pad, cy + slotSize * 1.6);

    // ---------- Комбо (центр, всплывающий бейдж) ----------
    if (combo > 1) {
        if (combo !== lastShownCombo) {
            hudComboScale = 1.5;
            lastShownCombo = combo;
        }
        hudComboScale += (1 - hudComboScale) * 0.15;
        hudComboAlpha += (1 - hudComboAlpha) * 0.2;
    } else {
        hudComboAlpha += (0 - hudComboAlpha) * 0.15;
        if (hudComboAlpha < 0.01) lastShownCombo = 0;
    }

    if (hudComboAlpha > 0.01 && combo > 1) {
        ctx.save();
        ctx.globalAlpha = hudComboAlpha;

        const comboFontSize = Math.max(16, W * 0.048);
        ctx.font = `bold ${comboFontSize * hudComboScale}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const badgeX = W / 2;
        const badgeY = cy;
        const text = `x${combo}`;

        const tw = ctx.measureText(text).width;
        const badgePadX = comboFontSize * 0.55;
        const badgePadY = comboFontSize * 0.35;
        const badgeW = tw + badgePadX * 2;
        const badgeH = comboFontSize + badgePadY * 2;

        let badgeColor = '#f1c40f';
        if (combo >= 5) badgeColor = '#ff9f43';
        if (combo >= 10) badgeColor = '#ff4757';
        if (combo >= 20) badgeColor = '#a55eea';

        ctx.shadowBlur = 20;
        ctx.shadowColor = badgeColor;

        ctx.fillStyle = badgeColor;
        roundRect(ctx, badgeX - badgeW / 2, badgeY - badgeH / 2, badgeW, badgeH, badgeH / 2);
        ctx.fill();

        ctx.shadowBlur = 0;

        ctx.fillStyle = '#1a1a1a';
        ctx.fillText(text, badgeX, badgeY + 1);

        const barW = badgeW * 0.8;
        const barH2 = 3;
        const barX = badgeX - barW / 2;
        const barY = badgeY + badgeH / 2 + 6;
        const progress = Math.max(0, comboTimer / COMBO_TIMEOUT);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        roundRect(ctx, barX, barY, barW, barH2, barH2 / 2);
        ctx.fill();

        ctx.fillStyle = badgeColor;
        roundRect(ctx, barX, barY, barW * progress, barH2, barH2 / 2);
        ctx.fill();

        ctx.restore();
    }

    ctx.restore();
}

// =========================================================
//                     ОТРИСОВКА
// =========================================================
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(0, -cameraY);

    // ---- 1. Турбины и конусы ветра ----
    for (const zone of windZones) {
        ctx.save();
        ctx.translate(zone.x, zone.y);
        ctx.rotate(zone.angle);

        const spreadTan = Math.tan(zone.spread);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(zone.range, -zone.range * spreadTan);
        ctx.lineTo(zone.range, zone.range * spreadTan);
        ctx.closePath();
        ctx.fillStyle = 'rgba(0, 184, 148, 0.07)';
        ctx.fill();

        ctx.fillStyle = '#718093';
        ctx.strokeStyle = '#dcdde1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.rect(0, -TURBINE_H / 2, TURBINE_W, TURBINE_H);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#00b894';
        ctx.fillRect(TURBINE_W - 6, -TURBINE_H / 2 + 2, 4, TURBINE_H - 4);

        ctx.restore();
    }

    // ---- 2. Частицы (светлячки) ----
    for (const p of particles) {
        ctx.fillStyle = `rgba(241, 196, 15, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
    }

    // ---- 3. Платформы ----
    for (const p of platforms) {
        if (p.hitsLeft === 3) ctx.fillStyle = '#2ed573';
        else if (p.hitsLeft === 2) ctx.fillStyle = '#ffa502';
        else ctx.fillStyle = '#ff4757';

        const { x, y } = p.body.position;
        ctx.fillRect(x - PLATFORM_WIDTH / 2, y - PLATFORM_HEIGHT / 2, PLATFORM_WIDTH, PLATFORM_HEIGHT);

        ctx.fillStyle = '#1a1a1a';
        for (let i = 0; i < p.hitsLeft; i++) {
            ctx.beginPath();
            ctx.arc(
                (x - PLATFORM_WIDTH / 2) + (PLATFORM_WIDTH / (p.hitsLeft + 1)) * (i + 1),
                y, 2, 0, Math.PI * 2
            );
            ctx.fill();
        }
    }

    // ---- 4. Шарик ----
    ctx.save();
    ctx.translate(ball.position.x, ball.position.y);
    ctx.rotate(ball.angle);

    ctx.beginPath();
    ctx.arc(0, 0, BALL_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = '#ff4757';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ff4757';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(BALL_RADIUS, 0);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();

    ctx.restore();
    ctx.shadowBlur = 0;

    // ---- UI ----
    drawHUD();

    if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff4757';
        ctx.font = `bold ${Math.max(20, canvas.width * 0.075)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#fff';
        ctx.font = `${Math.max(14, canvas.width * 0.04)}px sans-serif`;
        ctx.fillText(`Результат: ${score} очков`, canvas.width / 2, canvas.height / 2 + 25);
        ctx.fillText('Нажмите для перезапуска', canvas.width / 2, canvas.height / 2 + 65);

        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
    }
}

// =========================================================
//          ИГРОВОЙ ЦИКЛ С ФИКСИРОВАННЫМ ШАГОМ
// =========================================================
let lastTime = 0;
let accumulator = 0;

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;

    let delta = timestamp - lastTime;
    lastTime = timestamp;

    // Защита от спирали смерти
    if (delta > CONFIG.misc.gameLoopMaxDelta) delta = CONFIG.misc.gameLoopMaxDelta;

    accumulator += delta;

    while (accumulator >= STEP) {
        update();
        accumulator -= STEP;
    }

    draw();
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
